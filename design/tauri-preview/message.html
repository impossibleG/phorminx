<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phorminx · Message</title>
  <link rel="stylesheet" href="preview.css">
  <link rel="stylesheet" href="message.css">
  <script src="message.js" defer></script>
</head>
<body>
  <main class="review">
    <header><small id="review-phase">MESSAGE</small><h1 id="review-to">To …</h1></header>
    <p id="review-status" role="status"></p>
    <textarea id="review-text" rows="5" maxlength="4000" aria-label="Message text" hidden></textarea>
    <footer><span id="review-hint"></span><div><button id="review-discard" type="button">Discard</button><button id="review-primary" type="button" class="primary">Send</button></div></footer>
  </main>
</body>
</html>
