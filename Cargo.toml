[workspace]
resolver = "2"
members = [
    "crates/phorminx-audio",
    "crates/phorminx-app",
    "crates/phorminx-bench",
    "crates/phorminx-core",
    "crates/phorminx-ollama",
    "crates/phorminx-persistence",
    "crates/phorminx-session",
    "crates/phorminx-setup",
    "crates/phorminx-ui",
    "crates/phorminx-vosk",
    "crates/phorminx-windows",
    "crates/phorminx-whisper",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/autoantohaki/phorminx"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "=1.0.100"
arboard = { version = "=3.6.1", default-features = false }
clap = { version = "=4.5.48", features = ["derive"] }
cpal = "=0.18.2"
ctrlc = "=3.5.1"
eframe = { version = "=0.36.1", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
hound = "=3.5.1"
libloading = "=0.8.9"
ringbuf = { version = "=0.5.1", default-features = false, features = ["alloc"] }
rusqlite = { version = "=0.37.0", features = ["bundled", "functions"] }
rubato = { version = "=5.0.0", default-features = false, features = ["fft_resampler"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
thiserror = "=2.0.20"
toml = "=1.1.4"
tempfile = "=3.23.0"
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }
whisper-rs = { version = "=0.16.0", default-features = false, features = ["tracing_backend"] }
windows = "=0.62.2"
winresource = "=0.1.31"
winit = { version = "=0.30.13", default-features = false }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
