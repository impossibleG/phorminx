[workspace]
resolver = "2"
members = [
    "crates/phorminx-audio",
    "crates/phorminx-bench",
    "crates/phorminx-core",
    "crates/phorminx-whisper",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/autoantohaki/phorminx"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "=1.0.100"
clap = { version = "=4.5.48", features = ["derive"] }
cpal = "=0.18.2"
hound = "=3.5.1"
thiserror = "=2.0.16"
whisper-rs = { version = "=0.16.0", default-features = false, features = ["tracing_backend"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
