[package]
name = "phorminx-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
default = []
desktop = []
vulkan = ["phorminx-whisper/vulkan"]
tauri-preview = ["dep:tauri", "dep:tauri-build"]
tauri-shell = ["tauri-preview", "dep:phorminx-messaging", "dep:tracing-subscriber"]
release-tools = []
# Local QA only: lets "Reinstall Phorminx" run a local installer named by
# PHORMINX_QA_INSTALLER. Never part of a published release.
reinstall-qa = []

[dependencies]
anyhow.workspace = true
arboard.workspace = true
base64.workspace = true
ring.workspace = true
semver.workspace = true
phorminx-assistant = { path = "../phorminx-assistant" }
clap.workspace = true
ctrlc.workspace = true
eframe.workspace = true
image.workspace = true
tauri = { version = "=2.12.1", optional = true, default-features = false, features = ["wry"] }
phorminx-audio = { path = "../phorminx-audio" }
phorminx-core = { path = "../phorminx-core" }
phorminx-ocr = { path = "../phorminx-ocr" }
phorminx-ollama = { path = "../phorminx-ollama" }
phorminx-messaging = { path = "../phorminx-messaging", optional = true, features = ["tor"] }
phorminx-persistence = { path = "../phorminx-persistence" }
# Opt-in Tor diagnostics for messaging (PHORMINX_MESSAGING_LOG).
tracing-subscriber = { version = "=0.3.23", optional = true, features = ["env-filter"] }
phorminx-session = { path = "../phorminx-session" }
phorminx-setup = { path = "../phorminx-setup" }
phorminx-ui = { path = "../phorminx-ui" }
phorminx-vosk = { path = "../phorminx-vosk" }
phorminx-whisper = { path = "../phorminx-whisper" }
phorminx-windows = { path = "../phorminx-windows" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
ureq.workspace = true
url.workspace = true
winit.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[build-dependencies]
winresource.workspace = true
tauri-build = { version = "=2.7.1", optional = true }

[[bin]]
name = "phorminx-tauri-preview"
path = "src/bin/tauri_preview.rs"
required-features = ["tauri-preview"]

[[bin]]
name = "phorminx_release"
path = "src/bin/phorminx_release.rs"
required-features = ["release-tools"]

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true
